<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--head-->
  </head>
  <body>
    <div id="app"><!--app--></div>
    <script>
      // Stands in for a browser extension: password managers (Proton Pass, LastPass…) add an
      // element right after an <input> before the page hydrates.
      document.querySelector("input").after(document.createElement("extension-control"));
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
